<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RPG Page</title>

<style>
body{margin:0;min-height:100vh;background:skyblue;font-family:Arial,sans-serif;padding:30px}
.box{background:white;border:3px solid #222;border-radius:16px;padding:24px;max-width:900px;margin:0 auto 24px}
.stat{margin:18px 0}
.stat-title{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px}
.bar{height:22px;border:2px solid #222;background:#eee}
.fill{height:100%;background:hotpink;width:0%}
input,textarea{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box}
textarea{min-height:80px;resize:vertical}
button{padding:10px;border:2px solid #222;background:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.add-button,.reset-button{width:100%}
.reset-button{margin-bottom:16px;color:red}
.routine-card,.dday-card,.project-card{border:2px solid #222;padding:14px;margin-top:12px;background:#f7f7f7}
.routine-top,.dday-top,.project-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.routine-left{display:flex;align-items:center;gap:10px;font-weight:bold}
.delete-button,.complete-button{color:red}
.reward-text{margin-top:8px;font-size:14px}
.weekly-row{display:grid;grid-template-columns:1.5fr repeat(7,40px);gap:8px;align-items:center;margin:10px 0}
.weekly-header{font-weight:bold;text-align:center}
.weekly-name{font-weight:bold}
.week-box{width:26px;height:26px;accent-color:hotpink}
.month-title{text-align:center}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;max-width:420px;margin:20px auto}
.month-day-name{text-align:center;font-weight:bold}
.month-cell{aspect-ratio:1/1;border-radius:8px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:12px}
.month-cell.done{background:#2ecc71;color:white;font-weight:bold}
.month-cell.empty{background:transparent}
.dday-name{font-weight:bold}
.dday-count{font-size:20px;font-weight:bold;color:hotpink}
.project-title{font-size:22px;font-weight:bold}
.project-progress-text{font-weight:bold;color:hotpink}
.project-progress-bar{height:20px;border:2px solid #222;background:#eee;margin:10px 0 16px}
.project-progress-fill{height:100%;background:hotpink;width:0%}
.subtask-scroll{display:flex;gap:12px;overflow-x:auto;padding:10px 0}
.subtask-card{min-width:190px;border:2px solid #222;background:white;padding:12px}
.subtask-title{font-weight:bold;margin-bottom:8px}
.calendar-wrap{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{text-align:center;font-weight:bold}
.cal-cell{min-height:92px;border:2px solid #222;background:#f7f7f7;padding:6px;font-size:12px}
.cal-cell.empty{background:transparent;border:none}
.cal-date{font-weight:bold;margin-bottom:4px}
.cal-task{border:1px solid #222;background:white;margin:4px 0;padding:4px;cursor:grab}
.cal-task button{font-size:11px;padding:4px;margin-top:4px}
.project-side{border:2px solid #222;background:#f7f7f7;padding:12px;max-height:520px;overflow:auto}
.side-project-title{font-weight:bold;margin-top:10px}
.side-task{border:1px solid #222;background:white;padding:8px;margin:6px 0;cursor:grab}
.mobile-date{width:100%;padding:6px;margin-top:6px;font-size:12px}
.date-label{font-size:11px;font-weight:bold;margin-top:6px}
</style>
</head>

<body>

<div class="box">
  <h1 id="playerName">DIANA</h1>
  <button class="reset-button" onclick="resetStats()">Reset All Stats</button>
  <div class="stat"><div class="stat-title"><span>Strength</span><span id="strengthText"></span></div><div class="bar"><div id="strengthBar" class="fill"></div></div></div>
  <div class="stat"><div class="stat-title"><span>Intelligence</span><span id="intelligenceText"></span></div><div class="bar"><div id="intelligenceBar" class="fill"></div></div></div>
  <div class="stat"><div class="stat-title"><span>Health</span><span id="healthText"></span></div><div class="bar"><div id="healthBar" class="fill"></div></div></div>
  <div class="stat"><div class="stat-title"><span>Discipline</span><span id="disciplineText"></span></div><div class="bar"><div id="disciplineBar" class="fill"></div></div></div>
</div>

<div class="box">
  <h2>Routine</h2>
  <label>Routine name</label><input id="routineName" type="text" placeholder="ex) Cycling 1 hour">
  <label>Strength XP</label><input id="strengthReward" type="number" value="0">
  <label>Intelligence XP</label><input id="intelligenceReward" type="number" value="0">
  <label>Health XP</label><input id="healthReward" type="number" value="0">
  <label>Discipline XP</label><input id="disciplineReward" type="number" value="0">
  <button class="add-button" onclick="addRoutine()">Add Routine</button>
  <div id="routineList"></div>
</div>

<div class="box">
  <h2>Weekly Habits</h2>
  <div class="weekly-row">
    <div></div><div class="weekly-header">M</div><div class="weekly-header">T</div><div class="weekly-header">W</div><div class="weekly-header">T</div><div class="weekly-header">F</div><div class="weekly-header">S</div><div class="weekly-header">S</div>
  </div>
  <div id="weeklyList"></div>
</div>

<div class="box">
  <h2 class="month-title" id="monthTitle"></h2>
  <p class="month-title" id="monthProgress"></p>
  <div class="month-grid" id="monthlyGrid"></div>
</div>

<div class="box">
  <h2>D-Day</h2>
  <label>Schedule name</label><input id="ddayName" type="text" placeholder="ex) Exam day">
  <label>Target date</label><input id="ddayDate" type="date">
  <button class="add-button" onclick="addDday()">Add D-Day</button>
  <div id="ddayList"></div>
</div>

<div class="box">
  <h2>Projects</h2>
  <label>Project name</label>
  <input id="projectName" type="text" placeholder="ex) Electrical exam">
  <button class="add-button" onclick="addProject()">Add Project</button>
  <div id="projectList"></div>
</div>

<div class="box">
  <h2>Calendar</h2>
  <div class="calendar-wrap">
    <div>
      <div class="calendar-top">
        <button id="prevMonthBtn" onclick="changeCalendarMonth(-1)">←</button>
        <h3 id="calendarTitle"></h3>
        <button id="nextMonthBtn" onclick="changeCalendarMonth(1)">→</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="project-side">
      <h3>Project Tasks</h3>
      <p style="font-size:12px;">PC: drag task / Phone: use Set Date.</p>
      <div id="calendarTaskList"></div>
    </div>
  </div>
</div>
<script>
let today=new Date().toDateString();
let calendarOffset=0;
let draggedTask=null;

function getTodayIndex(){let day=new Date().getDay();return(day+6)%7}
function getWeekKey(){let date=new Date();let day=date.getDay();let diff=date.getDate()-day+(day===0?-6:1);let monday=new Date(date.setDate(diff));return monday.toISOString().slice(0,10)}
function getMonthKey(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function getTodayDateNumber(){return new Date().getDate()}
function getDaysInMonth(){let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function getFirstDayBlankCount(){let d=new Date();let first=new Date(d.getFullYear(),d.getMonth(),1).getDay();return(first+6)%7}
function getTodayOnly(){let now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate())}
function getDaysLeft(targetDate){let todayOnly=getTodayOnly();let target=new Date(targetDate+"T00:00:00");let diff=target-todayOnly;return Math.ceil(diff/(1000*60*60*24))}
function toDateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}

let todayIndex=getTodayIndex();
let currentWeekKey=getWeekKey();
let currentMonthKey=getMonthKey();

let player=JSON.parse(localStorage.getItem("playerData"))||{name:"DIANA",stats:{strength:{level:1,xp:0},intelligence:{level:1,xp:0},health:{level:1,xp:0},discipline:{level:1,xp:0}}};
let routines=JSON.parse(localStorage.getItem("routineData"))||[];
let ddays=JSON.parse(localStorage.getItem("ddayData"))||[];
let projects=JSON.parse(localStorage.getItem("projectData"))||[];
let monthly=JSON.parse(localStorage.getItem("monthlyData"))||{monthKey:currentMonthKey,checkedDays:{},bonusGiven:false};

let lastVisitDate=localStorage.getItem("lastVisitDate");
let savedWeekKey=localStorage.getItem("weekKey");

if(monthly.monthKey!==currentMonthKey){monthly={monthKey:currentMonthKey,checkedDays:{},bonusGiven:false};localStorage.setItem("monthlyData",JSON.stringify(monthly))}
if(savedWeekKey!==currentWeekKey){routines.forEach(r=>{r.weekly=[false,false,false,false,false,false,false];r.weeklyBonusGiven=false;r.completed=false});localStorage.setItem("weekKey",currentWeekKey)}
if(lastVisitDate!==today){routines.forEach(r=>r.completed=false);localStorage.setItem("lastVisitDate",today)}

routines.forEach(r=>{if(!r.id)r.id=Date.now()+Math.random();if(!r.weekly)r.weekly=[false,false,false,false,false,false,false];if(r.weeklyBonusGiven===undefined)r.weeklyBonusGiven=false});
projects.forEach(p=>{if(p.completedCount===undefined)p.completedCount=0;if(p.totalTasks===undefined)p.totalTasks=p.subtasks.length;p.subtasks.forEach(t=>{if(t.scheduledDate===undefined)t.scheduledDate=""})});

function cleanExpiredDdays(){ddays=ddays.filter(item=>getDaysLeft(item.date)>=0)}
cleanExpiredDdays();

function saveAll(){
  localStorage.setItem("playerData",JSON.stringify(player));
  localStorage.setItem("routineData",JSON.stringify(routines));
  localStorage.setItem("lastVisitDate",today);
  localStorage.setItem("weekKey",currentWeekKey);
  localStorage.setItem("monthlyData",JSON.stringify(monthly));
  localStorage.setItem("ddayData",JSON.stringify(ddays));
  localStorage.setItem("projectData",JSON.stringify(projects));
}

function addXp(statName,amount){let stat=player.stats[statName];stat.xp+=amount;while(stat.xp>=100){stat.xp-=100;stat.level+=1}}
function removeXp(statName,amount){let stat=player.stats[statName];stat.xp-=amount;while(stat.xp<0&&stat.level>1){stat.level-=1;stat.xp+=100}if(stat.level===1&&stat.xp<0)stat.xp=0}

function resetStats(){
  if(!confirm("Reset all stats, weekly progress, monthly progress, and routine checks?"))return;
  player.stats={strength:{level:1,xp:0},intelligence:{level:1,xp:0},health:{level:1,xp:0},discipline:{level:1,xp:0}};
  routines.forEach(r=>{r.completed=false;r.weekly=[false,false,false,false,false,false,false];r.weeklyBonusGiven=false});
  monthly.checkedDays={};monthly.bonusGiven=false;
  saveAll();updateStatus();updateRoutineList();updateWeeklyList();updateMonthlyGrid();
}

function updateStatus(){
  document.getElementById("playerName").textContent=player.name;
  for(let statName in player.stats){
    let stat=player.stats[statName];
    document.getElementById(statName+"Text").textContent="Lv."+stat.level+" "+stat.xp+"/100";
    document.getElementById(statName+"Bar").style.width=stat.xp+"%";
  }
}

function addRoutine(){
  let name=document.getElementById("routineName").value.trim();
  if(name===""){alert("Routine name을 입력하세요.");return}
  routines.push({id:Date.now(),name:name,completed:false,weekly:[false,false,false,false,false,false,false],weeklyBonusGiven:false,rewards:{
    strength:Number(document.getElementById("strengthReward").value),
    intelligence:Number(document.getElementById("intelligenceReward").value),
    health:Number(document.getElementById("healthReward").value),
    discipline:Number(document.getElementById("disciplineReward").value)
  }});
  document.getElementById("routineName").value="";
  document.getElementById("strengthReward").value=0;
  document.getElementById("intelligenceReward").value=0;
  document.getElementById("healthReward").value=0;
  document.getElementById("disciplineReward").value=0;
  saveAll();updateRoutineList();updateWeeklyList();updateMonthlyTracker();
}

function checkWeeklyBonus(routine){
  let fullWeek=routine.weekly.every(day=>day===true);
  if(fullWeek&&!routine.weeklyBonusGiven){addXp("discipline",10);routine.weeklyBonusGiven=true;alert(routine.name+" weekly bonus! Discipline +10 XP")}
}

function updateMonthlyTracker(){
  let todayNumber=getTodayDateNumber();
  let allDoneToday=routines.length>0&&routines.every(r=>r.completed===true);
  if(allDoneToday)monthly.checkedDays[todayNumber]=true;
  let daysInMonth=getDaysInMonth(),completedCount=0;
  for(let i=1;i<=daysInMonth;i++){if(monthly.checkedDays[i])completedCount++}
  if(completedCount===daysInMonth&&!monthly.bonusGiven){addXp("discipline",50);monthly.bonusGiven=true;alert("Monthly bonus! Discipline +50 XP")}
  saveAll();updateStatus();updateMonthlyGrid();
}

function toggleRoutine(index){
  let routine=routines[index];
  routine.completed=!routine.completed;
  routine.weekly[todayIndex]=routine.completed;
  for(let stat in routine.rewards){
    let amount=routine.rewards[stat];
    if(amount>0){routine.completed?addXp(stat,amount):removeXp(stat,amount)}
  }
  checkWeeklyBonus(routine);
  saveAll();updateStatus();updateRoutineList();updateWeeklyList();updateMonthlyTracker();
}

function deleteRoutine(index){routines.splice(index,1);saveAll();updateStatus();updateRoutineList();updateWeeklyList();updateMonthlyTracker()}

function updateRoutineList(){
  let list=document.getElementById("routineList");list.innerHTML="";
  routines.forEach((routine,index)=>{
    let rewardText="";
    for(let stat in routine.rewards){if(routine.rewards[stat]>0)rewardText+=stat+" +"+routine.rewards[stat]+" XP<br>"}
    let card=document.createElement("div");card.className="routine-card";
    card.innerHTML='<div class="routine-top"><div class="routine-left"><input type="checkbox" '+(routine.completed?"checked":"")+' onchange="toggleRoutine('+index+')"><span>'+routine.name+'</span></div><button class="delete-button" onclick="deleteRoutine('+index+')">Delete</button></div><div class="reward-text">'+rewardText+'</div>';
    list.appendChild(card);
  });
}

function updateWeeklyList(){
  let list=document.getElementById("weeklyList");list.innerHTML="";
  routines.forEach(routine=>{
    let row=document.createElement("div");row.className="weekly-row";let boxes="";
    for(let i=0;i<7;i++)boxes+='<input class="week-box" type="checkbox" disabled '+(routine.weekly[i]?"checked":"")+'>';
    row.innerHTML='<div class="weekly-name">'+routine.name+'</div>'+boxes;list.appendChild(row);
  });
}

function updateMonthlyGrid(){
  let d=new Date(),year=d.getFullYear(),month=d.getMonth()+1,daysInMonth=getDaysInMonth(),blanks=getFirstDayBlankCount();
  document.getElementById("monthTitle").textContent=year+"년 "+month+"월";
  let completedCount=0;for(let i=1;i<=daysInMonth;i++){if(monthly.checkedDays[i])completedCount++}
  document.getElementById("monthProgress").textContent=completedCount+" / "+daysInMonth+" days completed";
  let grid=document.getElementById("monthlyGrid");grid.innerHTML="";
  ["M","T","W","T","F","S","S"].forEach(name=>{let cell=document.createElement("div");cell.className="month-day-name";cell.textContent=name;grid.appendChild(cell)});
  for(let i=0;i<blanks;i++){let empty=document.createElement("div");empty.className="month-cell empty";grid.appendChild(empty)}
  for(let day=1;day<=daysInMonth;day++){let cell=document.createElement("div");cell.className="month-cell"+(monthly.checkedDays[day]?" done":"");cell.textContent=day;grid.appendChild(cell)}
}

function addDday(){
  let name=document.getElementById("ddayName").value.trim(),date=document.getElementById("ddayDate").value;
  if(name===""){alert("Schedule name을 입력하세요.");return}
  if(date===""){alert("Target date를 선택하세요.");return}
  if(getDaysLeft(date)<0){alert("지난 날짜는 추가할 수 없습니다.");return}

  ddays.push({id:Date.now(),name:name,date:date});

  document.getElementById("ddayName").value="";
  document.getElementById("ddayDate").value="";

  saveAll();
  updateDdayList();
  updateCalendar();
}

function completeDday(index){
  ddays.splice(index,1);
  saveAll();
  updateDdayList();
  updateCalendar();
}

function updateDdayList(){
  cleanExpiredDdays();ddays.sort((a,b)=>getDaysLeft(a.date)-getDaysLeft(b.date));
  let list=document.getElementById("ddayList");list.innerHTML="";
  ddays.forEach((item,index)=>{
    let daysLeft=getDaysLeft(item.date),ddayText=daysLeft===0?"D-Day":"D-"+daysLeft;
    let card=document.createElement("div");card.className="dday-card";
    card.innerHTML='<div class="dday-top"><div><div class="dday-name">'+item.name+'</div><div>'+item.date+'</div></div><div class="dday-count">'+ddayText+'</div><button class="complete-button" onclick="completeDday('+index+')">Complete</button></div>';
    list.appendChild(card);
  });
  saveAll();
}

function addProject(){
  let name=document.getElementById("projectName").value.trim();
  if(name===""){alert("Project name을 입력하세요.");return}
  projects.push({id:Date.now(),name:name,subtasks:[],completedCount:0,totalTasks:0});
  document.getElementById("projectName").value="";
  saveAll();updateProjectList();updateCalendarTaskList();
}

function addSubtask(projectIndex){
  let titleInput=document.getElementById("subtaskTitle-"+projectIndex);
  let memoInput=document.getElementById("subtaskMemo-"+projectIndex);
  let title=titleInput.value.trim(),memo=memoInput.value.trim();
  if(title===""){alert("Sub task title을 입력하세요.");return}
  projects[projectIndex].subtasks.push({id:Date.now(),title:title,memo:memo,scheduledDate:""});
  projects[projectIndex].totalTasks+=1;
  titleInput.value="";memoInput.value="";
  saveAll();updateProjectList();updateCalendar();
}

function updateSubtaskMemo(projectIndex,subtaskIndex,value){projects[projectIndex].subtasks[subtaskIndex].memo=value;saveAll()}

function completeSubtask(projectIndex,subtaskIndex){
  projects[projectIndex].subtasks.splice(subtaskIndex,1);
  projects[projectIndex].completedCount+=1;
  saveAll();updateProjectList();updateCalendar();
}

function completeProject(projectIndex){
  if(!confirm("Complete this project and delete it?"))return;
  projects.splice(projectIndex,1);
  saveAll();updateProjectList();updateCalendar();
}

function deleteProject(projectIndex){
  if(!confirm("Delete this project?"))return;
  projects.splice(projectIndex,1);
  saveAll();updateProjectList();updateCalendar();
}

function getProjectProgress(project){
  if(project.totalTasks===0)return 0;
  return Math.round((project.completedCount/project.totalTasks)*100);
}

function updateProjectList(){
  let list=document.getElementById("projectList");list.innerHTML="";
  projects.forEach((project,projectIndex)=>{
    let progress=getProjectProgress(project),total=project.totalTasks,done=project.completedCount;
    let subtaskCards="";
    project.subtasks.forEach((task,subtaskIndex)=>{
      subtaskCards+='<div class="subtask-card" draggable="true" ondragstart="startDrag('+projectIndex+','+subtaskIndex+')"><div class="subtask-title">'+task.title+'</div><textarea placeholder="Memo" oninput="updateSubtaskMemo('+projectIndex+','+subtaskIndex+', this.value)">'+task.memo+'</textarea><button onclick="completeSubtask('+projectIndex+','+subtaskIndex+')">Complete</button></div>';
    });
    let card=document.createElement("div");card.className="project-card";
    card.innerHTML='<div class="project-top"><div class="project-title">'+project.name+'</div><button class="delete-button" onclick="deleteProject('+projectIndex+')">Delete</button></div><div class="project-progress-text">'+progress+'% completed ('+done+'/'+total+')</div><div class="project-progress-bar"><div class="project-progress-fill" style="width:'+progress+'%"></div></div><label>Sub task title</label><input id="subtaskTitle-'+projectIndex+'" type="text" placeholder="ex) Chapter 1"><label>Sub task memo</label><textarea id="subtaskMemo-'+projectIndex+'" placeholder="Write details here"></textarea><button class="add-button" onclick="addSubtask('+projectIndex+')">Add Sub Task</button><div class="subtask-scroll">'+subtaskCards+'</div>'+(progress===100&&total>0?'<button class="complete-button" onclick="completeProject('+projectIndex+')">Project Complete</button>':'');
    list.appendChild(card);
  });
}

function getCalendarViewDate(){
  let now=new Date();
  return new Date(now.getFullYear(),now.getMonth()+calendarOffset,1);
}

function changeCalendarMonth(change){
  let next=calendarOffset+change;
  if(next<-1||next>1)return;
  calendarOffset=next;
  updateCalendar();
}

function startDrag(projectIndex,subtaskIndex){
  draggedTask={projectIndex:projectIndex,subtaskIndex:subtaskIndex};
}

function scheduleSubtask(projectIndex,subtaskIndex,dateValue){
  if(!dateValue)return;
  let project=projects[projectIndex];
  if(!project||!project.subtasks[subtaskIndex])return;
  project.subtasks[subtaskIndex].scheduledDate=dateValue;
  saveAll();
  updateProjectList();
  updateCalendar();
}

function dropOnDate(dateKey){
  if(!draggedTask)return;
  let p=projects[draggedTask.projectIndex];
  if(!p||!p.subtasks[draggedTask.subtaskIndex])return;
  p.subtasks[draggedTask.subtaskIndex].scheduledDate=dateKey;
  draggedTask=null;
  saveAll();updateProjectList();updateCalendar();
}

function updateCalendar(){
  updateCalendarGrid();
  updateCalendarTaskList();
}

function updateCalendarGrid(){
  let view=getCalendarViewDate();
  let year=view.getFullYear(),month=view.getMonth();
  let daysInMonth=new Date(year,month+1,0).getDate();
  let first=new Date(year,month,1).getDay();
  let blanks=(first+6)%7;

  document.getElementById("calendarTitle").textContent=year+"년 "+(month+1)+"월";
  document.getElementById("prevMonthBtn").disabled=calendarOffset<=-1;
  document.getElementById("nextMonthBtn").disabled=calendarOffset>=1;

  let grid=document.getElementById("calendarGrid");
  grid.innerHTML="";

  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(day=>{
    let head=document.createElement("div");
    head.className="cal-head";
    head.textContent=day;
    grid.appendChild(head);
  });

  for(let i=0;i<blanks;i++){
    let empty=document.createElement("div");
    empty.className="cal-cell empty";
    grid.appendChild(empty);
  }

  for(let day=1;day<=daysInMonth;day++){
    let dateKey=toDateKey(year,month,day);
    let cell=document.createElement("div");
    cell.className="cal-cell";
    cell.ondragover=function(e){e.preventDefault()};
    cell.ondrop=function(){dropOnDate(dateKey)};

    let tasksHtml='<div class="cal-date">'+day+'</div>';

    projects.forEach((project,projectIndex)=>{
      project.subtasks.forEach((task,subtaskIndex)=>{
        if(task.scheduledDate===dateKey){
          tasksHtml+='<div class="cal-task" draggable="true" ondragstart="startDrag('+projectIndex+','+subtaskIndex+')"><strong>'+task.title+'</strong><br><small>'+project.name+'</small><br><button onclick="completeSubtask('+projectIndex+','+subtaskIndex+')">Complete</button></div>';
        }
      });
    });

    ddays.forEach((item,index)=>{
      if(item.date===dateKey){
        let daysLeft=getDaysLeft(item.date);
        let ddayText=daysLeft===0?"D-Day":"D-"+daysLeft;

        tasksHtml+='<div class="cal-task"><strong>🎯 '+item.name+'</strong><br><small>'+ddayText+'</small><br><button onclick="completeDday('+index+')">Complete</button></div>';
      }
    });

    cell.innerHTML=tasksHtml;
    grid.appendChild(cell);
  }
}

function updateCalendarTaskList(){
  let list=document.getElementById("calendarTaskList");
  list.innerHTML="";

  projects.forEach((project,projectIndex)=>{
    let projectBlock=document.createElement("div");
    let html='<div class="side-project-title">'+project.name+'</div>';

    project.subtasks.forEach((task,subtaskIndex)=>{
      html+='<div class="side-task" draggable="true" ondragstart="startDrag('+projectIndex+','+subtaskIndex+')">'+
        '<strong>'+task.title+'</strong>'+
        (task.scheduledDate?'<br><small>Scheduled: '+task.scheduledDate+'</small>':'')+
        '<div class="date-label">Set Date</div>'+
        '<input class="mobile-date" type="date" value="'+task.scheduledDate+'" onchange="scheduleSubtask('+projectIndex+','+subtaskIndex+', this.value)">'+
      '</div>';
    });

    projectBlock.innerHTML=html;
    list.appendChild(projectBlock);
  });
}

saveAll();
updateStatus();
updateRoutineList();
updateWeeklyList();
updateMonthlyGrid();
updateDdayList();
updateProjectList();
updateCalendar();
</script>
