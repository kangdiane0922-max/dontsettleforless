<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My RPG Page</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: skyblue;
  font-family: Arial, sans-serif;
  padding: 30px;
}

.box {
  background: white;
  border: 3px solid #222;
  border-radius: 16px;
  padding: 24px;
  max-width: 520px;
  margin: 0 auto 24px auto;
}

.stat {
  margin: 18px 0;
}

.stat-title {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  margin-bottom: 6px;
}

.bar {
  height: 22px;
  border: 2px solid #222;
  background: #eee;
}

.fill {
  height: 100%;
  background: hotpink;
  width: 0%;
}

input {
  width: 100%;
  padding: 10px;
  margin: 6px 0 12px 0;
  box-sizing: border-box;
}

button {
  padding: 10px;
  border: 2px solid #222;
  background: white;
  font-weight: bold;
  cursor: pointer;
}

.add-button {
  width: 100%;
}

.routine-card {
  border: 2px solid #222;
  padding: 14px;
  margin-top: 12px;
  background: #f7f7f7;
}

.routine-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.routine-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.delete-button {
  width: auto;
  color: red;
}

.reward-text {
  margin-top: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">
  <h1 id="playerName">DIANA</h1>

  <div class="stat">
    <div class="stat-title"><span>Strength</span><span id="strengthText"></span></div>
    <div class="bar"><div id="strengthBar" class="fill"></div></div>
  </div>

  <div class="stat">
    <div class="stat-title"><span>Intelligence</span><span id="intelligenceText"></span></div>
    <div class="bar"><div id="intelligenceBar" class="fill"></div></div>
  </div>

  <div class="stat">
    <div class="stat-title"><span>Health</span><span id="healthText"></span></div>
    <div class="bar"><div id="healthBar" class="fill"></div></div>
  </div>

  <div class="stat">
    <div class="stat-title"><span>Discipline</span><span id="disciplineText"></span></div>
    <div class="bar"><div id="disciplineBar" class="fill"></div></div>
  </div>
</div>

<div class="box">
  <h2>Routine</h2>

  <label>Routine name</label>
  <input id="routineName" type="text" placeholder="ex) Cycling 1 hour">

  <label>Strength XP</label>
  <input id="strengthReward" type="number" value="0">

  <label>Intelligence XP</label>
  <input id="intelligenceReward" type="number" value="0">

  <label>Health XP</label>
  <input id="healthReward" type="number" value="0">

  <label>Discipline XP</label>
  <input id="disciplineReward" type="number" value="0">

  <button class="add-button" onclick="addRoutine()">Add Routine</button>

  <div id="routineList"></div>
</div>

<script>
let today = new Date().toDateString();

let player = JSON.parse(localStorage.getItem("playerData")) || {
  name: "DIANA",
  stats: {
    strength: { level: 1, xp: 0 },
    intelligence: { level: 1, xp: 0 },
    health: { level: 1, xp: 0 },
    discipline: { level: 1, xp: 0 }
  }
};

let routines = JSON.parse(localStorage.getItem("routineData")) || [];
let lastVisitDate = localStorage.getItem("lastVisitDate");

if (lastVisitDate !== today) {
  routines.forEach(function(routine) {
    routine.completed = false;
  });
  localStorage.setItem("lastVisitDate", today);
  localStorage.setItem("routineData", JSON.stringify(routines));
}

function saveAll() {
  localStorage.setItem("playerData", JSON.stringify(player));
  localStorage.setItem("routineData", JSON.stringify(routines));
  localStorage.setItem("lastVisitDate", today);
}

function addXp(statName, amount) {
  let stat = player.stats[statName];
  stat.xp += amount;

  while (stat.xp >= 100) {
    stat.xp -= 100;
    stat.level += 1;
  }
}

function removeXp(statName, amount) {
  let stat = player.stats[statName];
  stat.xp -= amount;

  while (stat.xp < 0 && stat.level > 1) {
    stat.level -= 1;
    stat.xp += 100;
  }

  if (stat.level === 1 && stat.xp < 0) {
    stat.xp = 0;
  }
}

function updateStatus() {
  document.getElementById("playerName").textContent = player.name;

  for (let statName in player.stats) {
    let stat = player.stats[statName];

    document.getElementById(statName + "Text").textContent =
      "Lv." + stat.level + " " + stat.xp + "/100";

    document.getElementById(statName + "Bar").style.width =
      stat.xp + "%";
  }
}

function addRoutine() {
  let name = document.getElementById("routineName").value.trim();

  if (name === "") {
    alert("Routine name을 입력하세요.");
    return;
  }

  let routine = {
    name: name,
    completed: false,
    rewards: {
      strength: Number(document.getElementById("strengthReward").value),
      intelligence: Number(document.getElementById("intelligenceReward").value),
      health: Number(document.getElementById("healthReward").value),
      discipline: Number(document.getElementById("disciplineReward").value)
    }
  };

  routines.push(routine);

  document.getElementById("routineName").value = "";
  document.getElementById("strengthReward").value = 0;
  document.getElementById("intelligenceReward").value = 0;
  document.getElementById("healthReward").value = 0;
  document.getElementById("disciplineReward").value = 0;

  saveAll();
  updateRoutineList();
}

function toggleRoutine(index) {
  let routine = routines[index];

  routine.completed = !routine.completed;

  for (let stat in routine.rewards) {
    let amount = routine.rewards[stat];

    if (amount > 0) {
      if (routine.completed) {
        addXp(stat, amount);
      } else {
        removeXp(stat, amount);
      }
    }
  }

  saveAll();
  updateStatus();
  updateRoutineList();
}

function deleteRoutine(index) {
  let routine = routines[index];

  if (routine.completed) {
    for (let stat in routine.rewards) {
      let amount = routine.rewards[stat];

      if (amount > 0) {
        removeXp(stat, amount);
      }
    }
  }

  routines.splice(index, 1);

  saveAll();
  updateStatus();
  updateRoutineList();
}

function updateRoutineList() {
  let list = document.getElementById("routineList");
  list.innerHTML = "";

  routines.forEach(function(routine, index) {
    let rewardText = "";

    for (let stat in routine.rewards) {
      if (routine.rewards[stat] > 0) {
        rewardText += stat + " +" + routine.rewards[stat] + " XP<br>";
      }
    }

    let card = document.createElement("div");
    card.className = "routine-card";

    card.innerHTML =
      '<div class="routine-top">' +
        '<div class="routine-left">' +
          '<input type="checkbox" ' + (routine.completed ? "checked" : "") +
          ' onchange="toggleRoutine(' + index + ')">' +
          '<span>' + routine.name + '</span>' +
        '</div>' +
        '<button class="delete-button" onclick="deleteRoutine(' + index + ')">Delete</button>' +
      '</div>' +
      '<div class="reward-text">' + rewardText + '</div>';

    list.appendChild(card);
  });
}

saveAll();
updateStatus();
updateRoutineList();
</script>

</body>
</html>
